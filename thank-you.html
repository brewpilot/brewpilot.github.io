<script
  src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
  defer
></script>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - Brew Pilot</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="static/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/favicon/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="static/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="static/favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="static/favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut icon" href="static/favicon/favicon.ico" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta
      name="msapplication-TileImage"
      content="static/favicon/mstile-150x150.png"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Custom CSS & Fonts -->
    <link rel="stylesheet" href="static/custom.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="custom-header" x-data x-init="fetch('/components/nav_header.html').then(res => res.text()).then(html => $el.innerHTML = html)">
      <!-- Header will load into here -->
    </header>

    <!-- Thank You Content -->
    <main class="thank-you-container">
      <div class="thank-you-box">
        <h1>Thank you!</h1>
        <p>
          Your message has been received. We'll be in touch with you shortly.
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer" x-data x-init="fetch('/components/nav_footer.html').then(res => res.text()).then(html => $el.innerHTML = html)">
      <!-- Footer will load into here -->
    </footer>
  </body>
</html>
